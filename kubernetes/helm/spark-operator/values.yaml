# Helm values for the Kubeflow Spark Operator.
#
# This replaces the old `kubernetes/fix_operator.yaml`, which was a raw
# `kubectl get deployment -o yaml` dump of a live, hand-patched operator
# (complete with resourceVersion / uid / status) — not something that can be
# re-applied reproducibly. The only settings that actually mattered in that dump
# are captured declaratively below and installed via the pinned chart.
#
# Install (chart version pinned for reproducibility):
#   helm repo add spark-operator https://kubeflow.github.io/spark-operator
#   helm upgrade --install spark-operator spark-operator/spark-operator \
#     --namespace bigdata --create-namespace \
#     --version 2.4.0 \
#     -f kubernetes/helm/spark-operator/values.yaml

# Pin the controller image to match the chart version (was implicit in the dump:
# ghcr.io/kubeflow/spark-operator/controller:2.4.0).
image:
  registry: ghcr.io
  repository: kubeflow/spark-operator/controller
  tag: "2.4.0"
  pullPolicy: IfNotPresent

controller:
  replicas: 1

# The operator only watches the bigdata namespace, where SparkApplications run
# (the dump encoded this as `--namespaces=bigdata`). Empty list = all namespaces.
spark:
  jobNamespaces:
    - bigdata

# Prometheus metrics were enabled in the live deployment; keep them on.
prometheus:
  metrics:
    enable: true
    port: 8080
    endpoint: /metrics

# Leader election was on (single replica, but future-proofs a scale-up).
controller.leaderElection:
  enable: true
