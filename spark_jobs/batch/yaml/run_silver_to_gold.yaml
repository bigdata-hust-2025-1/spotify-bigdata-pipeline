# Rendered as a Jinja template by SparkKubernetesOperator: {{ ds }} / {{ ds_nodash }}
# are substituted at submit time (PR-12). The per-run name suffix keeps backfills
# of different dates from colliding. MinIO credentials come from the
# `minio-credentials` Secret, never hardcoded (PR-02/PR-12).
apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: batch-silver-to-gold-{{ ds_nodash }}
  namespace: bigdata
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "xuanbinh282/spotify-spark-jobs:v1"
  imagePullPolicy: Always

  mainApplicationFile: "local:///opt/spark/work-dir/spark_jobs/batch/silver_to_gold_all.py"

  sparkVersion: "3.5.3"
  restartPolicy:
    type: Never

  sparkConf:
    "spark.jars.ivy": "/tmp/.ivy2"

  deps:
    packages:
      - org.apache.hadoop:hadoop-aws:3.3.4
      - com.amazonaws:aws-java-sdk-bundle:1.12.262

  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "1024m"
    labels:
      version: 3.5.3
    serviceAccount: spark-operator-spark
    env:
      - name: DT
        value: "{{ ds }}"
      - name: MINIO_ENDPOINT
        value: "http://minio.bigdata:9000"
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: access-key
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: secret-key

  executor:
    cores: 1
    instances: 1
    memory: "1024m"
    labels:
      version: 3.5.3
    env:
      - name: DT
        value: "{{ ds }}"
      - name: MINIO_ENDPOINT
        value: "http://minio.bigdata:9000"
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: access-key
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: secret-key
