# Iceberg table maintenance (compaction, snapshot expiry, orphan-file removal).
# Runs maintenance.py (PR-08) as the final batch step (PR-12). Rendered as a Jinja
# template by SparkKubernetesOperator: {{ ds_nodash }} makes the name unique per
# run. MinIO credentials come from the `minio-credentials` Secret.
apiVersion: "sparkoperator.k8s.io/v1beta2"
kind: SparkApplication
metadata:
  name: batch-maintenance-{{ ds_nodash }}
  namespace: bigdata
spec:
  type: Python
  pythonVersion: "3"
  mode: cluster
  image: "xuanbinh282/spotify-spark-jobs:v1"
  imagePullPolicy: Always

  mainApplicationFile: "local:///opt/spark/work-dir/spark_jobs/batch/maintenance.py"

  sparkVersion: "3.5.3"
  restartPolicy:
    type: Never

  sparkConf:
    "spark.jars.ivy": "/tmp/.ivy2"

  # Iceberg runtime + S3A: the maintenance CALLs run against the Iceberg catalog.
  deps:
    packages:
      - org.apache.hadoop:hadoop-aws:3.3.4
      - com.amazonaws:aws-java-sdk-bundle:1.12.262
      - org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:1.5.2

  driver:
    cores: 1
    coreLimit: "1200m"
    memory: "1024m"
    labels:
      version: 3.5.3
    serviceAccount: spark-operator-spark
    env:
      - name: DT
        value: "{{ ds }}"
      - name: MINIO_ENDPOINT
        value: "http://minio.bigdata:9000"
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: access-key
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: secret-key

  executor:
    cores: 1
    instances: 1
    memory: "1024m"
    labels:
      version: 3.5.3
    env:
      - name: DT
        value: "{{ ds }}"
      - name: MINIO_ENDPOINT
        value: "http://minio.bigdata:9000"
      - name: MINIO_ACCESS_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: access-key
      - name: MINIO_SECRET_KEY
        valueFrom:
          secretKeyRef:
            name: minio-credentials
            key: secret-key
