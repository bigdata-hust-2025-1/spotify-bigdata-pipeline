name: Conflict Marker Guard

# Fails the build if any tracked file contains an unresolved Git merge conflict
# marker. This is the systemic guard that prevents the PR-01 class of defect
# (conflict markers committed to a branch) from ever reaching main again.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check-conflict-markers:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Scan tracked files for merge conflict markers
        shell: bash
        run: |
          set -uo pipefail
          echo "Scanning tracked files for Git merge conflict markers..."

          # Matches, at the start of a line, exactly seven of a conflict-marker
          # character followed by a space/tab or end-of-line:
          #   <<<<<<< , ======= , >>>>>>> , ||||||| (diff3 style)
          # The trailing (space|tab|EOL) boundary prevents false positives on
          # decorative rules like a long "======================" line.
          # This workflow file is excluded so the pattern text below never
          # matches itself.
          pattern='^(<{7}|={7}|>{7}|\|{7})([ \t]|$)'

          if git grep -nP "$pattern" -- . ':!.github/workflows/conflict-guard.yml'; then
            echo "::error::Unresolved merge conflict markers detected (see matches above)."
            exit 1
          fi

          echo "OK: no merge conflict markers found."
