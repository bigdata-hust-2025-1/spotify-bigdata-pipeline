apiVersion: apps/v1
kind: Deployment
metadata:
  name: spotify-consumer
  namespace: bigdata
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spotify-consumer
  template:
    metadata:
      labels:
        app: spotify-consumer
    spec:
      containers:
      - name: consumer
        image: duongnguyen2204/spotify-consumer:latest
        envFrom:
        - secretRef:
            name: consumer-secrets  # Sử dụng secret